<html><title>Items</title><body><center>
<table width=240 cellpadding=0 cellspacing=0>
<tr><td width=42><button value="Main" action="bypass -h admin_admin" width=40 height=16 back="sek.cbui94" fore="sek.cbui92"></td><td width=156 align=center><font color="LEVEL">Create items</font></td><td width=42></td></tr>
</table>
<br1>
<table width=240 cellpadding=0 cellspacing=0>
<tr><td width=78 height=22 align=center>Item ID</td><td width=60 align=center>Amount</td><td width=52 align=center>Radius</td><td width=50></td></tr>
<tr>
<td align=center><edit var="id" width=62 type=number></td>
<td align=center><edit var="amount" width=46 type=number></td>
<td align=center><edit var="radius" width=36 type=number></td>
<td align=center><button value="Create" action="bypass -h admin_item $id $amount $radius" width=48 height=20 back="sek.cbui94" fore="sek.cbui92"></td>
</tr>
</table>
<br1>
<table width=240 cellpadding=0 cellspacing=0>
<tr>
<td width=78 align=center><combobox width=65 height=17 var=cb list=Adena;Ancient;Festival;></td>
<td width=81 align=center><button value="Create Coin" action="bypass -h admin_item coin $cb $amount $radius" width=76 height=20 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=81 align=center><button value="Create Set" action="bypass -h admin_item set" width=76 height=20 back="sek.cbui94" fore="sek.cbui92"></td>
</tr>
</table>
<br1>
<font color="AAAAAA">Defaults: amount 1, radius 0</font><br><br1>
<font color="LEVEL">Clear inventory</font><br1>Owner: %inventoryOwner%<br><br1>
<table width=240 cellpadding=0 cellspacing=0>
<tr>
<td width=120 align=center><button value="My items" action="bypass -h admin_item inventory self" width=112 height=20 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=120 align=center><button value="Target items" action="bypass -h admin_item inventory target" width=112 height=20 back="sek.cbui94" fore="sek.cbui92"></td>
</tr>
</table>
<br1>
%inventoryButtons%
</center></body></html>
